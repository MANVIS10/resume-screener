{% extends "base.html" %}
{% block title %}Apply — {{ job.title }}{% endblock %}
{% block nav %}<a href="/">All Roles</a>{% endblock %}
{% block content %}
<h1>Apply: {{ job.title }}</h1>
<p class="meta">{{ job.company }}</p>

<div class="card">
    <details>
        <summary>View job description</summary>
        <pre style="white-space: pre-wrap; font-family: inherit;">{{ job.jd_text }}</pre>
    </details>
</div>

{% if error %}<div class="error">{{ error }}</div>{% endif %}

<div class="card">
    <form method="post" action="/apply/{{ job.id }}" enctype="multipart/form-data">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" required>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" required>

        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="16" max="100" required>

        <label for="location">Current location / place</label>
        <input type="text" id="location" name="location" required>

        <label for="resume">Resume (.docx or .pdf)</label>
        <input type="file" id="resume" name="resume" accept=".docx,.pdf" required>

        <div style="margin-top:1.5rem;">
            <button class="btn" type="submit">Submit Application</button>
        </div>
    </form>
</div>
{% endblock %}
